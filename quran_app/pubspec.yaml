name: quran_app
description: "A Quran App with Mushaf Features"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^19.5.0
  flutter_downloader: ^1.11.8
  timezone: ^0.10.1
  flutter_timezone: ^3.0.0
  android_intent_plus: ^5.3.0
  http: ^1.1.0
  audioplayers: ^6.0.0
  flutter_html: ^3.0.0
  html_unescape: ^2.0.0
  wakelock_plus: ^1.2.6
  device_preview: ^1.2.0
  share_plus: ^10.1.2
  screenshot: ^3.0.0
  home_widget: ^0.8.1
  workmanager: ^0.9.0+3
  scrollable_positioned_list: ^0.3.8
  audio_service: ^0.18.18
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/qcf/
    - assets/fonts/QCF2BSMLfonts/

  fonts:
    # Surah number font
    - family: arsura
      fonts:
        - asset: assets/fonts/arsura.ttf

    # Verse numbers font
    - family: versenumbers
      fonts:
        - asset: assets/fonts/versenumbers-Regular.otf

    # Basmala font
    - family: QCF_BSML
      fonts:
        - asset: assets/fonts/QCF2BSMLfonts/QCF4_QBSML-Regular.woff

    # QCF Page Fonts - All 604 pages
